
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | NEXORA Premium</title>
  <meta name="description" content="Create your secure NEXORA business account.">
  <meta name="theme-color" content="#101b2d">

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 85% 15%, #f1e9d9 0, transparent 35%),
        linear-gradient(135deg, #ffffff, #f7f8fa);
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
    }

    .register-header {
      padding: 22px 5%;
      border-bottom: 1px solid #e7eaf0;
      background: #ffffff;
    }

    .register-header .logo {
      font-size: 1.8rem;
      text-decoration: none;
      font-weight: 800;
      color: #101b2d;
    }

    .register-header .logo span {
      color: #c9a96e;
    }

    .register-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 45px 18px;
    }

    .register-card {
      width: 100%;
      max-width: 500px;
      background: #ffffff;
      padding: 40px;
      border: 1px solid #e7eaf0;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(16,27,45,.10);
    }

    .register-brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      background: #101b2d;
      color: #c9a96e;
      font-size: 1.5rem;
      font-weight: 900;
      border-radius: 14px;
    }

    .register-brand h1 {
      color: #101b2d;
      font-size: 2rem;
      margin-bottom: 9px;
    }

    .register-brand p {
      color: #748094;
      font-size: .93rem;
    }

    .register-form label {
      display: block;
      margin: 17px 0 7px;
      color: #101b2d;
      font-size: .9rem;
      font-weight: 700;
    }

    .register-form input:not([type="checkbox"]) {
      width: 100%;
      padding: 14px;
      border: 1px solid #e7eaf0;
      border-radius: 8px;
      outline: none;
      color: #101b2d;
      background: #fcfcfd;
      font-size: 15px;
    }

    .register-form input:focus {
      border-color: #c9a96e;
      box-shadow: 0 0 0 3px rgba(201,169,110,.12);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 75px !important;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #a8874c;
      font-weight: 700;
      cursor: pointer;
    }

    .password-help {
      display: block;
      margin-top: 7px;
      color: #748094;
      font-size: .76rem;
    }

    .terms-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 22px 0;
      color: #748094;
      font-size: .83rem;
      line-height: 1.6;
    }

    .terms-row input {
      margin-top: 4px;
      accent-color: #c9a96e;
    }

    .terms-row a {
      color: #a8874c;
      font-weight: 700;
    }

    .register-submit {
      width: 100%;
      border: 0;
      padding: 15px;
      border-radius: 8px;
      background: #101b2d;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      transition: .3s;
    }

    .register-submit:hover {
      background: #1b2b43;
    }

    .register-submit:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .register-status {
      margin-top: 15px;
      min-height: 22px;
      font-size: .85rem;
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .register-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 25px 0;
      color: #9aa3b1;
      font-size: .8rem;
    }

    .register-divider::before,
    .register-divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #e7eaf0;
    }

    .login-text {
      text-align: center;
      font-size: .9rem;
      color: #748094;
    }

    .login-text a,
    .back-home {
      color: #a8874c;
      font-weight: 700;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #748094;
      font-size: .85rem;
      text-decoration: none;
    }

    .register-footer {
      text-align: center;
      padding: 22px;
      border-top: 1px solid #e7eaf0;
      font-size: .8rem;
      color: #748094;
    }

    @media(max-width: 480px) {
      .register-card {
        padding: 30px 22px;
      }

      .register-brand h1 {
        font-size: 1.7rem;
      }
    }
  </style>
</head>

<body>

  <header class="register-header">
    <a href="index.html" class="logo">
      NEXORA<span>.</span>
    </a>
  </header>

  <main class="register-main">

    <section class="register-card">

      <div class="register-brand">
        <div class="brand-mark">N</div>
        <h1>Create Account</h1>
        <p>Join NEXORA and create your business account.</p>
      </div>

      <form class="register-form" id="registerForm">

        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          maxlength="80"
          required
        >

        <label for="registerEmail">Email Address</label>
        <input
          type="email"
          id="registerEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

        <label for="phoneNumber">Phone Number</label>
        <input
          type="tel"
          id="phoneNumber"
          placeholder="Enter your phone number"
          autocomplete="tel"
          maxlength="20"
          required
        >

        <label for="registerPassword">Create Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="registerPassword"
            placeholder="Create your password"
            autocomplete="new-password"
            minlength="8"
            required
          >

          <button
            type="button"
            class="show-password"
            data-toggle="registerPassword"
          >Show</button>
        </div>

        <small class="password-help">
          Use at least 8 characters.
        </small>

        <label for="confirmPassword">Confirm Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Enter your password again"
            autocomplete="new-password"
            minlength="8"
            required
          >

          <button
            type="button"
            class="show-password"
            data-toggle="confirmPassword"
          >Show</button>
        </div>

        <div class="terms-row">
          <input
            type="checkbox"
            id="acceptTerms"
            required
          >

          <label for="acceptTerms" style="margin:0;font-weight:400;">
            I agree to the
            <a href="terms.html">Terms & Conditions</a>
            and
            <a href="privacy.html">Privacy Policy</a>.
          </label>
        </div>

        <button
          type="submit"
          class="register-submit"
          id="registerButton"
        >
          Create Account
        </button>

        <p
          class="register-status"
          id="registerStatus"
          role="status"
          aria-live="polite"
        ></p>

      </form>

      <div class="register-divider">OR</div>

      <p class="login-text">
        Already have an account?
        <a href="login.html">Sign In</a>
      </p>

      <a href="index.html" class="back-home">
        ← Back to Homepage
      </a>

    </section>
  </main>

  <footer class="register-footer">
    <p>
      © <span id="currentYear"></span>
      NEXORA. All rights reserved.
    </p>
  </footer>

  <script type="module">

    import { auth } from "./firebase.js";

    import {
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const form = document.getElementById("registerForm");
    const nameInput = document.getElementById("fullName");
    const emailInput = document.getElementById("registerEmail");
    const phoneInput = document.getElementById("phoneNumber");
    const passwordInput = document.getElementById("registerPassword");
    const confirmInput = document.getElementById("confirmPassword");

    const termsInput = document.getElementById("acceptTerms");
    const button = document.getElementById("registerButton");
    const status = document.getElementById("registerStatus");

    document.getElementById("currentYear").textContent =
      new Date().getFullYear();

    function showMessage(message, color = "#c0392b") {
      status.textContent = message;
      status.style.color = color;
    }

    // Show / Hide password
    document.querySelectorAll("[data-toggle]").forEach(toggle => {
      toggle.addEventListener("click", () => {
        const input = document.getElementById(toggle.dataset.toggle);
        const isHidden = input.type === "password";

        input.type = isHidden ? "text" : "password";
        toggle.textContent = isHidden ? "Hide" : "Show";
      });
    });

    // Firebase error messages
    function getErrorMessage(code) {
      const messages = {
        "auth/email-already-in-use":
          "This email already has an account. Please sign in.",

        "auth/invalid-email":
          "Please enter a valid email address.",

        "auth/weak-password":
          "Your password is too weak. Use at least 8 characters.",

        "auth/operation-not-allowed":
          "Email/Password registration is disabled in Firebase.",

        "auth/network-request-failed":
          "Network error. Please check your internet connection.",

        "auth/too-many-requests":
          "Too many attempts. Please try again later.",

        "auth/unauthorized-domain":
          "This website domain is not authorized in Firebase.",

        "auth/invalid-api-key":
          "Firebase API key is invalid. Check firebase.js.",

        "auth/configuration-not-found":
          "Firebase Authentication configuration is missing."
      };

      return messages[code] ||
        "Registration failed. Firebase error: " + (code || "unknown");
    }

    // Create Firebase account
    form.addEventListener("submit", async (event) => {

      event.preventDefault();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim().toLowerCase();
      const phone = phoneInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmInput.value;

      if (name.length < 2) {
        showMessage("Please enter your full name.");
        return;
      }

      if (!phone) {
        showMessage("Please enter your phone number.");
        return;
      }

      if (password.length < 8) {
        showMessage("Password must contain at least 8 characters.");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
      }

      if (!termsInput.checked) {
        showMessage("Please accept the Terms & Conditions.");
        return;
      }

      button.disabled = true;
      button.textContent = "Creating Account...";

      showMessage(
        "Creating your account. Please wait...",
        "#748094"
      );

      try {

        const result = await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        // Save user's name to Firebase Authentication profile
        try {
          await updateProfile(result.user, {
            displayName: name
          });
        } catch (profileError) {
          console.error("Profile update error:", profileError);
        }

        showMessage(
          "Your NEXORA account has been created successfully!",
          "#18864b"
        );

        form.reset();

        setTimeout(() => {
          window.location.href = "login.html";
        }, 2000);

      } catch (error) {

        console.error("Firebase registration error:", error);

        showMessage(getErrorMessage(error.code));

      } finally {

        button.disabled = false;
        button.textContent = "Create Account";

      }

    });

  </script>

</body>
</html>
