
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your NEXORA account.">
  <title>Create Account | NEXORA</title>

  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f7f8fa;
      color: #101b2d;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px 15px;
    }

    .register-container {
      width: 100%;
      max-width: 460px;
      background: #fff;
      padding: 38px;
      border: 1px solid #e8eaf0;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(16, 27, 45, 0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand a {
      color: #101b2d;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 3px;
      text-decoration: none;
    }

    .brand span {
      color: #c9a96e;
    }

    .brand p {
      color: #737b89;
      font-size: 14px;
      margin-top: 9px;
    }

    h1 {
      font-size: 25px;
      margin: 0 0 8px;
      text-align: center;
    }

    .subtitle {
      color: #7a8290;
      font-size: 14px;
      text-align: center;
      margin-bottom: 26px;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dce0e7;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background: #fff;
    }

    input:focus {
      border-color: #c9a96e;
      box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.13);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 65px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: #a18148;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 19px 0;
      font-size: 13px;
      color: #626b79;
      line-height: 1.5;
    }

    .terms input {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .terms a,
    .login-link a {
      color: #a18148;
      font-weight: 600;
      text-decoration: none;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #101b2d;
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:hover {
      background: #1d304b;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #statusMessage {
      display: none;
      padding: 12px;
      border-radius: 7px;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 16px;
      overflow-wrap: anywhere;
    }

    #statusMessage.success {
      display: block;
      background: #eaf7ee;
      color: #176b35;
    }

    #statusMessage.error {
      display: block;
      background: #fff0f0;
      color: #b42318;
    }

    .login-link {
      text-align: center;
      margin-top: 23px;
      font-size: 14px;
      color: #737b89;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #737b89;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      .register-container {
        padding: 27px 20px;
      }
    }
  </style>
</head>

<body>

  <main class="register-container">

    <div class="brand">
      <a href="index.html">NEXORA<span>.</span></a>
      <p>Business Management Platform</p>
    </div>

    <h1>Create Account</h1>
    <p class="subtitle">Create your account to get started.</p>

    <div id="statusMessage" role="status" aria-live="polite"></div>

    <form id="registerForm">

      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          maxlength="80"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="Enter your phone number"
          autocomplete="tel"
          maxlength="20"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="password"
            placeholder="Minimum 8 characters"
            autocomplete="new-password"
            minlength="8"
            required
          >
          <button
            type="button"
            class="toggle-password"
            data-target="password"
          >SHOW</button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Enter password again"
            autocomplete="new-password"
            required
          >
          <button
            type="button"
            class="toggle-password"
            data-target="confirmPassword"
          >SHOW</button>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" id="agreeTerms" required>
        <span>
          I agree to the
          <a href="terms.html">Terms & Conditions</a>
          and
          <a href="privacy.html">Privacy Policy</a>.
        </span>
      </label>

      <button type="submit" class="submit-btn" id="registerBtn">
        Create Account
      </button>

    </form>

    <p class="login-link">
      Already have an account?
      <a href="login.html">Login</a>
    </p>

    <a href="index.html" class="back-home">
      ← Back to Home
    </a>

  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";

    import {
      createUserWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

    import {
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";

    const form = document.getElementById("registerForm");
    const registerBtn = document.getElementById("registerBtn");
    const statusMessage = document.getElementById("statusMessage");

    const fullName = document.getElementById("fullName");
    const email = document.getElementById("email");
    const phone = document.getElementById("phone");
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const agreeTerms = document.getElementById("agreeTerms");

    function showMessage(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = type;
    }

    document.querySelectorAll(".toggle-password").forEach(button => {
      button.addEventListener("click", () => {
        const field = document.getElementById(button.dataset.target);

        if (field.type === "password") {
          field.type = "text";
          button.textContent = "HIDE";
        } else {
          field.type = "password";
          button.textContent = "SHOW";
        }
      });
    });

    function getFirebaseError(error) {
      const messages = {
        "auth/email-already-in-use":
          "This email address already has an account.",
        "auth/invalid-email":
          "Please enter a valid email address.",
        "auth/weak-password":
          "Please choose a stronger password.",
        "auth/api-key-not-valid":
          "Firebase API key is invalid. Check your Firebase configuration.",
        "auth/operation-not-allowed":
          "Email/Password Authentication is not enabled in Firebase.",
        "auth/network-request-failed":
          "Network error. Please check your internet connection.",
        "auth/too-many-requests":
          "Too many attempts. Please try again later."
      };

      return messages[error.code] ||
        "Registration failed: " + error.message;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const nameValue = fullName.value.trim();
      const emailValue = email.value.trim().toLowerCase();
      const phoneValue = phone.value.trim();
      const passwordValue = password.value;
      const confirmValue = confirmPassword.value;

      statusMessage.className = "";
      statusMessage.textContent = "";

      if (nameValue.length < 2) {
        showMessage("Please enter your full name.", "error");
        return;
      }

      if (!/^\+?[0-9\s()-]{7,20}$/.test(phoneValue)) {
        showMessage("Please enter a valid phone number.", "error");
        return;
      }

      if (passwordValue.length < 8) {
        showMessage("Password must be at least 8 characters.", "error");
        return;
      }

      if (passwordValue !== confirmValue) {
        showMessage("Passwords do not match.", "error");
        return;
      }

      if (!agreeTerms.checked) {
        showMessage("Please accept the Terms & Conditions.", "error");
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = "Creating Account...";

      let createdUser = null;

      try {
        // Create Firebase Authentication account
        const credential = await createUserWithEmailAndPassword(
          auth,
          emailValue,
          passwordValue
        );

        createdUser = credential.user;

        // Save the user's display name
        await updateProfile(createdUser, {
          displayName: nameValue
        });

        // Save user information in Firestore
        await setDoc(doc(db, "users", createdUser.uid), {
          uid: createdUser.uid,
          fullName: nameValue,
          email: emailValue,
          phone: phoneValue,
          role: "user",
          createdAt: serverTimestamp()
        });

        showMessage(
          "Account created successfully! Redirecting to login...",
          "success"
        );

        form.reset();

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1800);

      } catch (error) {

        if (createdUser) {
          showMessage(
            "Your Authentication account was created, but saving your profile in Firestore failed. Do not register again. Check Firestore permissions and contact support.",
            "error"
          );
        } else {
          showMessage(getFirebaseError(error), "error");
        }

      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = "Create Account";
      }
    });
  </script>

</body>
</html>
