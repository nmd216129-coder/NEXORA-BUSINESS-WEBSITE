
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | NEXORA</title>
  <meta name="description" content="Login to your NEXORA business management account.">

  <style>
    :root {
      --navy: #101b2d;
      --gold: #c9a96e;
      --bg: #f7f8fa;
      --white: #ffffff;
      --text: #263247;
      --muted: #7b8493;
      --border: #e4e8ee;
      --danger: #c0392b;
      --success: #18794e;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand a {
      color: var(--navy);
      text-decoration: none;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .brand span {
      color: var(--gold);
    }

    .brand p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 9px;
    }

    .login-card {
      background: var(--white);
      padding: 38px 32px;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(16, 27, 45, 0.07);
    }

    .login-card h1 {
      color: var(--navy);
      font-size: 27px;
      margin-bottom: 9px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 9px;
      color: var(--navy);
    }

    .form-group input {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
      font-size: 15px;
      background: #fff;
    }

    .form-group input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 169, 110, 0.13);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 65px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--navy);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 4px 0 24px;
      font-size: 13px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
    }

    .remember input {
      accent-color: var(--navy);
    }

    .forgot-link,
    .register-link,
    .home-link {
      color: var(--navy);
      text-decoration: none;
      font-weight: 600;
    }

    .forgot-link:hover,
    .register-link:hover,
    .home-link:hover {
      color: var(--gold);
    }

    .login-button {
      width: 100%;
      height: 49px;
      border: none;
      border-radius: 7px;
      background: var(--navy);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-button:hover {
      background: #1b2d49;
    }

    .login-button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .status-message {
      display: none;
      margin-top: 17px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .status-message.success {
      display: block;
      color: var(--success);
      background: #eaf7ef;
    }

    .status-message.error {
      display: block;
      color: var(--danger);
      background: #fff0ee;
    }

    .register-text {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-top: 25px;
    }

    .register-text a {
      margin-left: 4px;
    }

    .home-link-wrapper {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
    }

    .footer-text {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: 25px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .login-card {
        padding: 30px 22px;
      }

      .login-card h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="login-wrapper">

    <div class="brand">
      <a href="index.html">NEX<span>ORA</span></a>
      <p>Business Management Platform</p>
    </div>

    <section class="login-card">

      <h1>Welcome Back</h1>
      <p class="subtitle">Login to access your NEXORA account.</p>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-password"
              id="togglePassword"
              aria-label="Show password"
            >
              SHOW
            </button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="rememberMe" checked>
            Remember me
          </label>
        </div>

        <button type="submit" class="login-button" id="loginButton">
          Login to Account
        </button>

        <div
          id="statusMessage"
          class="status-message"
          role="status"
          aria-live="polite"
        ></div>

      </form>

      <p class="register-text">
        Don't have an account?
        <a href="register.html" class="register-link">Create Account</a>
      </p>

    </section>

    <div class="home-link-wrapper">
      <a href="index.html" class="home-link">← Back to Home</a>
    </div>

    <p class="footer-text">
      © <span id="currentYear"></span> NEXORA. All rights reserved.
    </p>

  </main>

  <script type="module">
    import { auth } from "./firebase.js";

    import {
      signInWithEmailAndPassword,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const rememberMe = document.getElementById("rememberMe");
    const loginButton = document.getElementById("loginButton");
    const statusMessage = document.getElementById("statusMessage");
    const togglePassword = document.getElementById("togglePassword");

    document.getElementById("currentYear").textContent =
      new Date().getFullYear();

    function showMessage(message, type) {
      statusMessage.textContent = message;
      statusMessage.className = "status-message " + type;
    }

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";
      togglePassword.textContent = isPassword ? "HIDE" : "SHOW";
      togglePassword.setAttribute(
        "aria-label",
        isPassword ? "Hide password" : "Show password"
      );
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Please enter your email and password.", "error");
        return;
      }

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {
        const persistence = rememberMe.checked
          ? browserLocalPersistence
          : browserSessionPersistence;

        await setPersistence(auth, persistence);

        const userCredential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        showMessage(
          "Login successful. Your account is signed in.",
          "success"
        );

        console.log("Logged in user UID:", userCredential.user.uid);

        // Dashboard redirect will be added after dashboard.html is created.

      } catch (error) {
        let message = "Login failed. Please try again.";

        switch (error.code) {
          case "auth/invalid-email":
            message = "Please enter a valid email address.";
            break;

          case "auth/invalid-credential":
          case "auth/wrong-password":
          case "auth/user-not-found":
            message = "Incorrect email or password.";
            break;

          case "auth/user-disabled":
            message = "This account has been disabled.";
            break;

          case "auth/too-many-requests":
            message = "Too many attempts. Please try again later.";
            break;

          case "auth/network-request-failed":
            message = "Network error. Please check your internet connection.";
            break;
        }

        showMessage(message, "error");

      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Login to Account";
      }
    });
  </script>

</body>
</html>
